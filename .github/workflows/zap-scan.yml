name: Full Stack Security Scan with Baseline ZAP Scan and Automated Issue Management

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # Daily scan at midnight UTC

jobs:
  full-stack-security-scan:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create required labels
      - name: Create Required Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Security severity labels
          gh label create "security" --color "d93f0b" --description "Security-related issues" || true
          gh label create "CRITICAL" --color "b60205" --description "Critical severity security issues" || true
          gh label create "HIGH" --color "d93f0b" --description "High severity security issues" || true
          gh label create "MEDIUM" --color "fbca04" --description "Medium severity security issues" || true
          gh label create "LOW" --color "0e8a16" --description "Low severity security issues" || true
          gh label create "INFORMATIONAL" --color "006b75" --description "Informational security issues" || true

          # Finding type labels
          gh label create "ZAP" --color "1d76db" --description "ZAP scanner findings" || true
          gh label create "container" --color "5319e7" --description "Container security findings" || true
          gh label create "secrets" --color "b60205" --description "Secrets detection findings" || true
          gh label create "sql-injection" --color "d93f0b" --description "SQL injection findings" || true
          gh label create "web-server" --color "fbca04" --description "Web server security findings" || true

          # Priority labels
          gh label create "priority:0" --color "b60205" --description "P0 - Critical priority" || true
          gh label create "priority:1" --color "d93f0b" --description "P1 - High priority" || true
          gh label create "priority:2" --color "fbca04" --description "P2 - Medium priority" || true
          gh label create "priority:3" --color "0e8a16" --description "P3 - Low priority" || true

          # Status labels
          gh label create "needs-review" --color "d4c5f9" --description "Issue needs review" || true
          gh label create "urgent" --color "b60205" --description "Urgent attention required" || true

      # Ensure Juice Shop is Up
      - name: Wait for Juice Shop to Start
        run: |
          for i in {1..30}; do
            if curl --output /dev/null --silent --head --fail http://localhost:3000; then
              echo "✅ Juice Shop is running!"
              exit 0
            fi
            echo "⏳ Waiting for Juice Shop..."
            sleep 5
          done
          echo "❌ Juice Shop did not start in time."
          exit 1

      # Pull & Run ZAP Baseline Scan
      - name: Pull ZAP Docker Image (Cached)
        run: docker pull --quiet zaproxy/zap-stable

      - name: Run ZAP Baseline Scan (Allow Warnings)
        run: |
          docker run --rm \
            --network host \
            --user root \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:3000 -r zap_report.html -J zap_report.json --auto || true

      # Format ZAP Report
      - name: Format ZAP Report
        run: |
          echo "<html><head><title>ZAP Baseline Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > zap_report_formatted.html
          echo "<h1>ZAP Baseline Report</h1>" >> zap_report_formatted.html
          cat zap_report.html >> zap_report_formatted.html
          echo "</body></html>" >> zap_report_formatted.html

      # Pull & Run Trivy Scan
      - name: Pull Trivy Docker Image (Cached)
        run: docker pull --quiet aquasec/trivy:latest

      - name: Run Trivy Scan for Container Vulnerabilities
        run: |
          mkdir -p results  # Ensure results directory exists

          docker run --rm \
            -v $(pwd)/results:/results \
            aquasec/trivy:latest \
            image --format json --output /results/trivy_report.json bkimminich/juice-shop

      # Format Trivy Report
      - name: Format Trivy Report
        run: |
          echo "<html><head><title>Trivy Scan Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > results/trivy_report.html
          echo "<h1>Trivy Scan Report</h1>" >> results/trivy_report.html
          echo "<table><tr><th>Vulnerability</th><th>Severity</th><th>Package</th><th>Version</th><th>Fixed Version</th></tr>" >> results/trivy_report.html
          cat results/trivy_report.json | jq -r '.Results[]?.Vulnerabilities[]? | "<tr><td>\(.VulnerabilityID)</td><td>\(.Severity)</td><td>\(.PkgName)</td><td>\(.InstalledVersion)</td><td>\(.FixedVersion)</td></tr>"' >> results/trivy_report.html
          echo "</table></body></html>" >> results/trivy_report.html

      # Pull & Run SQLMap Scan
      - name: Pull Python Docker Image (Cached)
        run: docker pull --quiet python:3.9-slim

      - name: Run SQLMap Scan
        run: |
          mkdir -p results/sqlmap_report  # Ensure SQLMap report directory exists

          docker run --rm \
            --network host \
            --user root \
            -v $(pwd)/results:/results \
            python:3.9-slim bash -c "
              pip install sqlmap &&
              sqlmap -u 'http://localhost:3000/rest/user/login' --batch --crawl=2 --risk=2 --level=3 --output-dir=/results/sqlmap_report
            "

      # Format SQLMap Report
      - name: Format SQLMap Report
        run: |
          echo "<html><head><title>SQLMap Scan Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > results/sqlmap_report/sqlmap_report.html
          echo "<h1>SQLMap Scan Report</h1>" >> results/sqlmap_report/sqlmap_report.html
          echo "<pre>" >> results/sqlmap_report/sqlmap_report.html
          cat results/sqlmap_report/* >> results/sqlmap_report/sqlmap_report.html || echo "No SQL injection vulnerabilities found." >> results/sqlmap_report/sqlmap_report.html
          echo "</pre></body></html>" >> results/sqlmap_report/sqlmap_report.html

      # Run Nikto (Web Server Vulnerability Scanner)
      - name: Pull Nikto Docker Image (Cached)
        run: docker pull --quiet hysnsec/nikto:latest

      - name: Run Nikto Scan
        run: |
          mkdir -p results/nikto_report

          docker run --rm \
            --network host \
            --user root \
            -v $(pwd)/results:/results \
            hysnsec/nikto:latest \
            -h http://localhost:3000 -o /results/nikto_report/nikto_report.txt

      # Format Nikto Report
      - name: Format Nikto Report
        run: |
          echo "<html><head><title>Nikto Scan Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > results/nikto_report/nikto_report.html
          echo "<h1>Nikto Scan Report</h1>" >> results/nikto_report/nikto_report.html
          echo "<pre>" >> results/nikto_report/nikto_report.html
          cat results/nikto_report/nikto_report.txt >> results/nikto_report/nikto_report.html || echo "No vulnerabilities found." >> results/nikto_report/nikto_report.html
          echo "</pre></body></html>" >> results/nikto_report/nikto_report.html

      # Run TruffleHog (Secrets Detection)
      - name: Pull TruffleHog Docker Image (Cached)
        run: docker pull --quiet trufflesecurity/trufflehog:latest

      - name: Run TruffleHog Scan
        run: |
          mkdir -p results/trufflehog_report

          docker run --rm \
            -v $(pwd):/src \
            --user root \
            trufflesecurity/trufflehog:latest \
            filesystem /src --json > results/trufflehog_report/trufflehog_report.json || true

      # Format TruffleHog Report
      - name: Format TruffleHog Report
        run: |
          echo "<html><head><title>TruffleHog Scan Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > results/trufflehog_report/trufflehog_report.html
          echo "<h1>TruffleHog Scan Report</h1>" >> results/trufflehog_report/trufflehog_report.html
          echo "<table><tr><th>Secret Type</th><th>File</th><th>Line</th><th>Commit</th></tr>" >> results/trufflehog_report/trufflehog_report.html
          cat results/trufflehog_report/trufflehog_report.json | jq -r '. | "<tr><td>\(.DetectorName)</td><td>\(.SourceMetadata.Data.Filesystem.file)</td><td>\(.SourceMetadata.Data.Filesystem.line)</td><td>\(.SourceMetadata.Data.Filesystem.commit)</td></tr>"' >> results/trufflehog_report/trufflehog_report.html
          echo "</table></body></html>" >> results/trufflehog_report/trufflehog_report.html

      # Combine Reports
      - name: Combine Reports
        run: |
          echo "<html><head><title>Full Stack Security Scan Report</title><style>body { font-family: Arial, sans-serif; } table { width: 100%; border-collapse: collapse; } th, td { padding: 8px; text-align: left; border-bottom: 1px solid #ddd; } th { background-color: #f2f2f2; }</style></head><body>" > combined_report.html
          echo "<h1>Full Stack Security Scan Report</h1>" >> combined_report.html

          echo "<h2>ZAP Baseline Report</h2>" >> combined_report.html
          cat zap_report_formatted.html >> combined_report.html

          echo "<h2>Trivy Report</h2>" >> combined_report.html
          cat results/trivy_report.html >> combined_report.html

          echo "<h2>SQLMap Report</h2>" >> combined_report.html
          cat results/sqlmap_report/sqlmap_report.html >> combined_report.html

          echo "<h2>Nikto Report</h2>" >> combined_report.html
          cat results/nikto_report/nikto_report.html >> combined_report.html

          echo "<h2>TruffleHog Report</h2>" >> combined_report.html
          cat results/trufflehog_report/trufflehog_report.html >> combined_report.html

          echo "</body></html>" >> combined_report.html
          
      # Upload Reports
      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-security-reports
          path: |
            zap_report_formatted.html
            results/trivy_report.html
            results/sqlmap_report/sqlmap_report.html
            results/nikto_report/nikto_report.html
            results/trufflehog_report/trufflehog_report.html
            combined_report.html
          
      # Create security team configuration file
      - name: Setup Security Team Configuration
        run: |
          mkdir -p .github
          {
            echo '{'
            echo '  "teams": {'
            echo '    "web-security": ["'"$GITHUB_ACTOR"'"],'
            echo '    "container-security": ["'"$GITHUB_ACTOR"'"],'
            echo '    "secrets-management": ["'"$GITHUB_ACTOR"'"],'
            echo '    "sql-injection": ["'"$GITHUB_ACTOR"'"],'
            echo '    "infrastructure-security": ["'"$GITHUB_ACTOR"'"]'
            echo '  },'
            echo '  "severity_deadlines": {'
            echo '    "CRITICAL": 3,'
            echo '    "HIGH": 7,'
            echo '    "MEDIUM": 14,'
            echo '    "LOW": 30,'
            echo '    "INFORMATIONAL": 60'
            echo '  },'
            echo '  "default_team": ["'"$GITHUB_ACTOR"'"],'
            echo '  "default_deadline": 30'
            echo '}'
          } > .github/security-team-config.json
        
      # Process ZAP Findings and Create Issues
      - name: Process ZAP Findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "zap_report.json" ]; then
            echo "Processing ZAP findings..."
            FINDINGS=$(jq -r '.site[0].alerts[]? | select(.riskcode >= "1")' zap_report.json)
            
            if [ ! -z "$FINDINGS" ]; then
              echo "$FINDINGS" | jq -c '.' | while read -r finding; do
                TITLE=$(echo $finding | jq -r '.name')
                RISK=$(echo $finding | jq -r '.riskdesc' | cut -d' ' -f1)
                DESC=$(echo $finding | jq -r '.desc')
                SOLUTION=$(echo $finding | jq -r '.solution')
                
                # Map risk to severity
                case "$RISK" in
                  "High") SEVERITY="HIGH"; TEAM="web-security" ;;
                  "Medium") SEVERITY="MEDIUM"; TEAM="web-security" ;;
                  "Low") SEVERITY="LOW"; TEAM="web-security" ;;
                  *) SEVERITY="INFORMATIONAL"; TEAM="web-security" ;;
                esac
                
                # Get deadline from config
                DEADLINE_DAYS=$(jq -r ".severity_deadlines.\"$SEVERITY\" // .default_deadline" .github/security-team-config.json)
                DEADLINE_DATE=$(date -d "+$DEADLINE_DAYS days" +"%Y-%m-%d")
                
                # Get team assignment from config
                ASSIGNEES=$(jq -r ".teams.\"$TEAM\" // .default_team" .github/security-team-config.json | jq -r '.[]')
                
                # Create assignee flags for each team member
                ASSIGNEE_FLAGS=""
                for ASSIGNEE in $ASSIGNEES; do
                  ASSIGNEE_FLAGS="$ASSIGNEE_FLAGS --assignee $ASSIGNEE"
                done
                
                # Create issue
                issue_body="## Security Finding\n**Risk Level:** $RISK\n**Deadline:** $DEADLINE_DATE\n**Finding Type:** Web Application Vulnerability\n\n**Description:**\n$DESC\n\n**Solution:**\n$SOLUTION\n\n**Affected Endpoints:**\n$(echo $finding | jq -r '.instances[]? | "- " + .uri')\n\n*This issue was automatically created by the security scanning workflow.*"
                
                gh issue create --title "[ZAP][$SEVERITY] $TITLE" \
                  --body "$issue_body" \
                  --label "security,$SEVERITY,ZAP" \
                  $ASSIGNEE_FLAGS
              done
            else
              echo "No ZAP findings to process."
            fi
          else
            echo "ZAP JSON report not found."
          fi
          
      # Process Trivy Findings
      - name: Process Trivy Findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .github
          if [ ! -f ".github/security-team-config.json" ]; then
            echo "Security team config not found. Creating default config..."
            {
              echo '{'
              echo '  "teams": {'
              echo '    "web-security": ["'"$GITHUB_ACTOR"'"],'
              echo '    "container-security": ["'"$GITHUB_ACTOR"'"],'
              echo '    "secrets-management": ["'"$GITHUB_ACTOR"'"],'
              echo '    "sql-injection": ["'"$GITHUB_ACTOR"'"],'
              echo '    "infrastructure-security": ["'"$GITHUB_ACTOR"'"]'
              echo '  },'
              echo '  "severity_deadlines": {'
              echo '    "CRITICAL": 3,'
              echo '    "HIGH": 7,'
              echo '    "MEDIUM": 14,'
              echo '    "LOW": 30,'
              echo '    "INFORMATIONAL": 60'
              echo '  },'
              echo '  "default_team": ["'"$GITHUB_ACTOR"'"],'
              echo '  "default_deadline": 30'
              echo '}'
            } > .github/security-team-config.json
          fi

          if [ -f "results/trivy_report.json" ]; then
            echo "Processing Trivy findings..."
            mkdir -p results/filtered
            
            # Validate Trivy report JSON
            if ! jq empty results/trivy_report.json 2>/dev/null; then
              echo "Error: Invalid JSON in Trivy report"
              exit 1
            fi
            
            # Extract vulnerabilities with error handling
            if ! jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity | test("CRITICAL|HIGH|MEDIUM"))' results/trivy_report.json > results/filtered/trivy_filtered.json; then
              echo "[]" > results/filtered/trivy_filtered.json
            fi
            
            # Validate filtered JSON
            if ! jq empty results/filtered/trivy_filtered.json 2>/dev/null; then
              echo "Error: Invalid JSON in filtered results"
              exit 1
            fi
            
            for SEVERITY in "CRITICAL" "HIGH" "MEDIUM"; do
              echo "Processing $SEVERITY vulnerabilities..."
              
              # Count vulnerabilities with error handling
              COUNT=$(jq -r "select(.Severity == \"$SEVERITY\")" results/filtered/trivy_filtered.json | jq -s 'length' || echo "0")
              
              if [ "$COUNT" -gt 0 ]; then
                echo "Found $COUNT $SEVERITY vulnerabilities"
                
                # Get configuration values with defaults
                DEADLINE_DAYS=$(jq -r ".severity_deadlines.\"$SEVERITY\" // 30" .github/security-team-config.json)
                DEADLINE_DATE=$(date -d "+$DEADLINE_DAYS days" +"%Y-%m-%d")
                
                # Get team members with error handling
                TEAM_MEMBERS=$(jq -r ".teams.\"container-security\" // .default_team | if type == \"array\" then .[] else empty end" .github/security-team-config.json)
                
                if [ -z "$TEAM_MEMBERS" ]; then
                  echo "Warning: No team members found, using GITHUB_ACTOR"
                  TEAM_MEMBERS="$GITHUB_ACTOR"
                fi
                
                # Build assignee flags
                ASSIGNEE_FLAGS=""
                for ASSIGNEE in $TEAM_MEMBERS; do
                  ASSIGNEE_FLAGS="$ASSIGNEE_FLAGS --assignee $ASSIGNEE"
                done
                
                # Create issue body with error handling
                VULNS=$(jq -r "select(.Severity == \"$SEVERITY\")" results/filtered/trivy_filtered.json | jq -s '.[0:20] | .[] | "- **" + .VulnerabilityID + "**: " + .Title + " (" + .PkgName + " " + .InstalledVersion + ")"' || echo "Error extracting vulnerability details")
                
                if [ "$VULNS" = "Error extracting vulnerability details" ]; then
                  echo "Error: Failed to extract vulnerability details"
                  continue
                fi
                
                EXTRA_COUNT=$((COUNT - 20))
                EXTRA_MSG=""
                if [ "$COUNT" -gt 20 ]; then
                  EXTRA_MSG="\n\n... and $EXTRA_COUNT more vulnerabilities"
                fi
                
                issue_body="## Container Security Finding\n**Severity:** $SEVERITY\n**Deadline:** $DEADLINE_DATE\n**Count:** $COUNT vulnerabilities\n\n**Vulnerabilities:**\n$VULNS$EXTRA_MSG\n\n**Recommended Action:**\nUpdate the affected packages to the fixed versions where available.\n\n*This issue was automatically created by the security scanning workflow.*"
                
                echo "Creating GitHub issue for $SEVERITY vulnerabilities..."
                if ! gh issue create \
                  --title "[Trivy][$SEVERITY] Container has $COUNT $SEVERITY vulnerabilities" \
                  --body "$issue_body" \
                  --label "security,$SEVERITY,container" \
                  $ASSIGNEE_FLAGS; then
                  echo "Failed to create issue for $SEVERITY vulnerabilities"
                  continue
                fi
                
                echo "Successfully created issue for $SEVERITY vulnerabilities"
              else
                echo "No $SEVERITY vulnerabilities found"
              fi
            done
          else
            echo "Trivy JSON report not found at results/trivy_report.json"
          fi
          
      # Process TruffleHog Findings
      - name: Process TruffleHog Findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "results/trufflehog_report/trufflehog_report.json" ]; then
            echo "Processing TruffleHog findings..."
            
            # Ensure valid JSON and count findings
            COUNT=$(cat results/trufflehog_report/trufflehog_report.json | jq -s '. | length' || echo "0")
            
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT potential secrets"
              
              # Secrets are always considered critical
              SEVERITY="CRITICAL"
              
              # Get deadline from config
              DEADLINE_DAYS=$(jq -r ".severity_deadlines.\"$SEVERITY\" // .default_deadline" .github/security-team-config.json)
              DEADLINE_DATE=$(date -d "+$DEADLINE_DAYS days" +"%Y-%m-%d")
              
              # Get team assignment from config
              ASSIGNEES=$(jq -r ".teams.\"secrets-management\" // .default_team | .[]" .github/security-team-config.json)
              
              # Create assignee flags for each team member
              ASSIGNEE_FLAGS=""
              for ASSIGNEE in $ASSIGNEES; do
                ASSIGNEE_FLAGS="$ASSIGNEE_FLAGS --assignee $ASSIGNEE"
              done
              
              # Create issue
              issue_body="## Secrets Detection Finding\n**Severity:** $SEVERITY\n**Deadline:** $DEADLINE_DATE\n**Count:** $COUNT potential secrets\n\n**Secrets Found:**\n$(cat results/trufflehog_report/trufflehog_report.json | jq -s '.[0:10] | .[] | "- **" + .DetectorName + "** found in " + .SourceMetadata.Data.Filesystem.file + " (line " + (.SourceMetadata.Data.Filesystem.line | tostring) + ")"')\n$([ "$COUNT" -gt 10 ] && echo "... and $(($COUNT - 10)) more")\n\n**Immediate Action Required:**\n1. Revoke these credentials immediately\n2. Rotate any compromised secrets\n3. Remove secrets from codebase and store in secure vault\n4. Implement proper secrets management\n\n*This issue was automatically created by the security scanning workflow.*"
              
              gh issue create --title "[TruffleHog][$SEVERITY] $COUNT potential secrets found in codebase" \
                --body "$issue_body" \
                --label "security,$SEVERITY,secrets" \
                $ASSIGNEE_FLAGS || echo "Failed to create issue for secrets findings"
            else
              echo "No TruffleHog findings to process."
            fi
          else
            echo "TruffleHog JSON report not found."
          fi
          
      # Process SQLMap Findings
      - name: Process SQLMap Findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "results/sqlmap_report" ]; then
            echo "Processing SQLMap findings..."
            
            # Check for injection points in the log files
            FINDINGS=$(find results/sqlmap_report -type f -name "*.log" -exec grep -l "Injection point" {} \; 2>/dev/null || true)
            
            if [ ! -z "$FINDINGS" ]; then
              echo "Found SQL injection vulnerabilities"
              
              # SQL injections are always high severity
              SEVERITY="HIGH"
              
              # Get deadline from config
              DEADLINE_DAYS=$(jq -r ".severity_deadlines.\"$SEVERITY\" // .default_deadline" .github/security-team-config.json)
              DEADLINE_DATE=$(date -d "+$DEADLINE_DAYS days" +"%Y-%m-%d")
              
              # Get team assignment from config
              ASSIGNEES=$(jq -r ".teams.\"sql-injection\" // .default_team | .[]" .github/security-team-config.json)
              
              # Create assignee flags for each team member
              ASSIGNEE_FLAGS=""
              for ASSIGNEE in $ASSIGNEES; do
                ASSIGNEE_FLAGS="$ASSIGNEE_FLAGS --assignee $ASSIGNEE"
              done
              
              # Create issue
              issue_body="## SQL Injection Finding\n**Severity:** $SEVERITY\n**Deadline:** $DEADLINE_DATE\n**Finding Type:** SQL Injection Vulnerability\n\n**Description:**\nSQLMap has detected potential SQL injection vulnerabilities in the application.\n\n**Affected Endpoints:**\n$(find results/sqlmap_report -type f -name "*.log" -exec grep -h "testing:" {} \; 2>/dev/null | grep -v "testing: " | sort -u | sed 's/^/- /')\n\n**Recommended Action:**\n1. Implement parameterized queries\n2. Add proper input validation\n3. Use an ORM with prepared statements\n4. Implement least privilege database accounts\n\n*This issue was automatically created by the security scanning workflow.*"
              
              gh issue create --title "[SQLMap][$SEVERITY] SQL Injection vulnerabilities detected" \
                --body "$issue_body" \
                --label "security,$SEVERITY,sql-injection" \
                $ASSIGNEE_FLAGS || echo "Failed to create issue for SQL injection findings"
            else
              echo "No SQLMap findings to process."
            fi
          else
            echo "SQLMap report directory not found."
          fi
          
      # Process Nikto Findings
      - name: Process Nikto Findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "results/nikto_report/nikto_report.txt" ]; then
            echo "Processing Nikto findings..."
            
            # Count findings (non-informational)
            COUNT=$(grep -c "+ " results/nikto_report/nikto_report.txt || echo "0")
            
            if [ "$COUNT" -gt 0 ]; then
              echo "Found $COUNT web server vulnerabilities"
              
              # Most Nikto findings are medium
              SEVERITY="MEDIUM"
              
              # Get deadline from config
              DEADLINE_DAYS=$(jq -r ".severity_deadlines.\"$SEVERITY\" // .default_deadline" .github/security-team-config.json)
              DEADLINE_DATE=$(date -d "+$DEADLINE_DAYS days" +"%Y-%m-%d")
              
              # Get team assignment from config
              ASSIGNEES=$(jq -r ".teams.\"infrastructure-security\" // .default_team | .[]" .github/security-team-config.json)
              
              # Create assignee flags for each team member
              ASSIGNEE_FLAGS=""
              for ASSIGNEE in $ASSIGNEES; do
                ASSIGNEE_FLAGS="$ASSIGNEE_FLAGS --assignee $ASSIGNEE"
              done
              
              # Create issue
              issue_body="## Web Server Security Finding\n**Severity:** $SEVERITY\n**Deadline:** $DEADLINE_DATE\n**Count:** $COUNT findings\n\n**Top Issues:**\n$(grep "+ " results/nikto_report/nikto_report.txt | head -10 | sed 's/^/- /')\n$([ "$COUNT" -gt 10 ] && echo "... and $(($COUNT - 10)) more")\n\n**Recommended Action:**\n1. Review and harden web server configuration\n2. Update server software to latest version\n3. Implement security headers\n4. Review and update TLS configuration\n\n*This issue was automatically created by the security scanning workflow.*"
              
              gh issue create --title "[Nikto][$SEVERITY] $COUNT web server vulnerabilities detected" \
                --body "$issue_body" \
                --label "security,$SEVERITY,web-server" \
                $ASSIGNEE_FLAGS || echo "Failed to create issue for web server findings"
            else
              echo "No Nikto findings to process."
            fi
          else
            echo "Nikto report not found."
          fi
      
      # Generate Security Dashboard
      - name: Create Security Dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Creating security dashboard..."
          
          cat > security-dashboard.md << EOF
          # Security Scan Dashboard
          
          Generated on: $(date)
          
          ## Summary
          
          | Scanner | Status | Critical | High | Medium | Low | Info |
          |---------|--------|---------|------|--------|-----|------|
          | ZAP     | $([ -f "zap_report.json" ] && echo "✅" || echo "❌") | $([ -f "zap_report.json" ] && jq -r '.site[0].alerts[]? | select(.riskcode == "3")' zap_report.json | jq -s 'length' || echo "0") | $([ -f "zap_report.json" ] && jq -r '.site[0].alerts[]? | select(.riskcode == "2")' zap_report.json | jq -s 'length' || echo "0") | $([ -f "zap_report.json" ] && jq -r '.site[0].alerts[]? | select(.riskcode == "1")' zap_report.json | jq -s 'length' || echo "0") | $([ -f "zap_report.json" ] && jq -r '.site[0].alerts[]? | select(.riskcode == "0")' zap_report.json | jq -s 'length' || echo "0") | $([ -f "zap_report.json" ] && jq -r '.site[0].alerts[]? | select(.riskcode == "-1")' zap_report.json | jq -s 'length' || echo "0") |
          | Trivy   | $([ -f "results/trivy_report.json" ] && echo "✅" || echo "❌") | $([ -f "results/trivy_report.json" ] && jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")' results/trivy_report.json | jq -s 'length' || echo "0") | $([ -f "results/trivy_report.json" ] && jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")' results/trivy_report.json | jq -s 'length' || echo "0") | $([ -f "results/trivy_report.json" ] && jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "MEDIUM")' results/trivy_report.json | jq -s 'length' || echo "0") | $([ -f "results/trivy_report.json" ] && jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "LOW")' results/trivy_report.json | jq -s 'length' || echo "0") | $([ -f "results/trivy_report.json" ] && jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "UNKNOWN")' results/trivy_report.json | jq -s 'length' || echo "0") |
          | TruffleHog | $([ -f "results/trufflehog_report/trufflehog_report.json" ] && echo "✅" || echo "❌") | $([ -f "results/trufflehog_report/trufflehog_report.json" ] && cat results/trufflehog_report/trufflehog_report.json | jq -s 'length' || echo "0") | 0 | 0 | 0 | 0 |
          | SQLMap  | $([ -d "results/sqlmap_report" ] && echo "✅" || echo "❌") | 0 | $(grep -l "Injection point" results/sqlmap_report/*.log 2>/dev/null | wc -l || echo "0") | 0 | 0 | 0 |
          | Nikto   | $([ -f "results/nikto_report/nikto_report.txt" ] && echo "✅" || echo "❌") | 0 | 0 | $(grep -c "+ " results/nikto_report/nikto_report.txt || echo "0") | 0 | 0 |
          
          ## Recent Issues
          
          $(gh issue list --label security --state open --limit 10 --json number,title,createdAt,labels | jq -r '.[] | "- #" + (.number | tostring) + " " + .title + " (" + (.createdAt | fromdateiso8601 | strftime("%Y-%m-%d")) + ")"')
          
          ## Metrics
          
          - Open security issues: $(gh issue list --label security --state open --json number | jq -r 'length')
          - Closed security issues: $(gh issue list --label security --state closed --json number | jq -r 'length')
          - Critical issues: $(gh issue list --label security,CRITICAL --state open --json number | jq -r 'length')
          - High issues: $(gh issue list --label security,HIGH --state open --json number | jq -r 'length')
          - Medium issues: $(gh issue list --label security,MEDIUM --state open --json number | jq -r 'length')
          - Low issues: $(gh issue list --label security,LOW --state open --json number | jq -r 'length')
          
          EOF
          
          gh gist create security-dashboard.md || echo "Failed to create gist, continuing..."

name: Full Stack Security Scan with Baseline ZAP Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # Daily scan at midnight UTC

jobs:
  full-stack-security-scan:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensure Juice Shop is Up
      - name: Wait for Juice Shop to Start
        run: |
          for i in {1..30}; do
            if curl --output /dev/null --silent --head --fail http://localhost:3000; then
              echo "✅ Juice Shop is running!"
              exit 0
            fi
            echo "⏳ Waiting for Juice Shop..."
            sleep 5
          done
          echo "❌ Juice Shop did not start in time."
          exit 1

      # Pull & Run ZAP Baseline Scan
      - name: Pull ZAP Docker Image (Cached)
        run: docker pull --quiet zaproxy/zap-stable

      - name: Run ZAP Baseline Scan (Allow Warnings)
        run: |
          docker run --rm \
            --network host \
            --user root \
            -v $(pwd):/zap/wrk/:rw \
            zaproxy/zap-stable \
            zap-baseline.py -t http://localhost:3000 -r zap_report.html --auto || true

      # Ensure ZAP Report Exists
      - name: Verify ZAP Report
        run: |
          if [ ! -f zap_report.html ]; then
            echo "❌ ZAP Report Not Found!"
            exit 1
          fi

      # Pull & Run Trivy Scan
      - name: Pull Trivy Docker Image (Cached)
        run: docker pull --quiet aquasec/trivy:latest

      - name: Run Trivy Scan for Container Vulnerabilities
        run: |
          mkdir -p results  # Ensure results directory exists

          docker run --rm \
            -v $(pwd)/results:/results \
            aquasec/trivy:latest \
            image --format json --output /results/trivy_report.json bkimminich/juice-shop

          # Convert JSON to HTML
          echo "<html><body><h1>Trivy Scan Report</h1><pre>" > results/trivy_report.html
          cat results/trivy_report.json | jq '.' >> results/trivy_report.html
          echo "</pre></body></html>" >> results/trivy_report.html

      # Pull & Run SQLMap Scan
      - name: Pull Python Docker Image (Cached)
        run: docker pull --quiet python:3.9-slim

      - name: Run SQLMap Scan
        run: |
          mkdir -p results/sqlmap_report  # Ensure SQLMap report directory exists

          docker run --rm \
            --network host \
            --user root \
            -v $(pwd)/results:/results \
            python:3.9-slim bash -c "
              pip install sqlmap &&
              sqlmap -u 'http://localhost:3000/rest/user/login' --batch --crawl=2 --risk=2 --level=3 --output-dir=/results/sqlmap_report
            "

      # Pull & Run Semgrep Scan
      - name: Pull Semgrep Docker Image (Cached)
        run: docker pull --quiet returntocorp/semgrep:latest

      - name: Run Semgrep Security Scan
        run: |
          mkdir -p src  # Ensure src directory exists

          # Disable metrics and use a local config for debugging
          echo "Running Semgrep with disabled metrics and a local config"
          docker run --rm \
            -v $(pwd)/src:/src \
            returntocorp/semgrep:latest \
            semgrep --config="p/ci" --metrics=off --output /src/semgrep_report.json || { echo "Semgrep scan failed"; exit 1; }

      # Combine Reports
      - name: Combine Reports
        run: |
          echo "<html><head><title>Security Scan Report</title></head><body>" > combined_report.html
          echo "<h1>Full Stack Security Scan Report</h1>" >> combined_report.html

          echo "<h2>ZAP Baseline Report</h2>" >> combined_report.html
          cat zap_report.html >> combined_report.html

          echo "<h2>Trivy Report</h2>" >> combined_report.html
          cat results/trivy_report.html >> combined_report.html

          echo "<h2>SQLMap Report</h2><pre>" >> combined_report.html
          cat results/sqlmap_report/* >> combined_report.html || echo "SQLMap report missing" >> combined_report.html
          echo "</pre>" >> combined_report.html

          echo "<h2>Semgrep Report</h2><pre>" >> combined_report.html
          cat src/semgrep_report.json >> combined_report.html || echo "Semgrep report missing" >> combined_report.html
          echo "</pre>" >> combined_report.html

          echo "</body></html>" >> combined_report.html

      # Upload Report
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-security-report
          path: combined_report.html

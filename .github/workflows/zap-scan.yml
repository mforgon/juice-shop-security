name: Full Stack Security Scan with Combined Report (Optimized)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # Daily scan at midnight UTC

jobs:
  full-stack-security-scan:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Wait for Juice Shop to start
      - name: Wait for Server to Start
        run: |
          for i in {1..30}; do
            if curl --output /dev/null --silent --head --fail http://localhost:3000; then
              echo "Server is up!"
              exit 0
            fi
            echo "Waiting for server..."
            sleep 5
          done
          echo "Server did not start in time."
          exit 1

      # Cache ZAP Docker Image to speed up scans
      - name: Cache ZAP Docker Image
        uses: actions/cache@v4
        with:
          path: /var/lib/docker
          key: zap-docker-${{ runner.os }}
          restore-keys: zap-docker-

      # Run ZAP Baseline Scan (Faster than Full Scan)
      - name: Run ZAP Baseline Scan (Faster)
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r zap_report.html || true

      # Run Trivy Scan for Container Vulnerabilities
      - name: Run Trivy Scan for Container Vulnerabilities
        run: |
          docker run --rm \
            -v $(pwd):/results \
            aquasec/trivy:latest \
            --format html --output /results/trivy_report.html \
            --no-progress \
            --scan-repository bkimminich/juice-shop

      # Run SQLMap Scan for SQL Injection Vulnerabilities
      - name: Run SQLMap Scan for SQL Injection
        run: |
          docker run --rm \
            --network host \
            -v $(pwd):/results \
            python:3.9-slim bash -c "
              pip install sqlmap &&
              sqlmap -u 'http://localhost:3000/rest/user/login' --batch --crawl=2 --risk=2 --level=3 --output-dir=/results/sqlmap_report
            "

      # Run Semgrep Security Scan (via Docker)
      - name: Run Semgrep Security Scan
        run: |
          docker run --rm \
            -v $(pwd):/src \
            returntocorp/semgrep:latest \
            semgrep --config="https://semgrep.dev/p/oss-security" --output /src/semgrep_report.json

      # Combine all reports into one
      - name: Combine Reports into One
        run: |
          echo "<html><head><title>Security Scan Report</title></head><body>" > combined_report.html
          echo "<h1>Full Stack Security Scan Report</h1>" >> combined_report.html

          echo "<h2>ZAP Security Scan Report</h2>" >> combined_report.html
          cat zap_report.html >> combined_report.html

          echo "<h2>Trivy Container Scan Report</h2>" >> combined_report.html
          cat trivy_report.html >> combined_report.html

          echo "<h2>SQLMap Scan Report</h2><pre>" >> combined_report.html
          cat sqlmap_report/* >> combined_report.html
          echo "</pre>" >> combined_report.html

          echo "<h2>Semgrep Scan Report</h2><pre>" >> combined_report.html
          cat semgrep_report.json >> combined_report.html
          echo "</pre>" >> combined_report.html

          echo "</body></html>" >> combined_report.html

      # Upload Combined Report
      - name: Upload Combined Report
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-security-report
          path: combined_report.html

name: Full Stack Security Scan with Combined Report

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # Daily scan at midnight UTC

jobs:
  full-stack-security-scan:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ZAP - Full Active Scan
      - name: Pull ZAP Docker Image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run ZAP Full Active Scan
        run: |
          docker run \
            --network host \
            -v $(pwd):/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://localhost:3000 \
            -r zap_full_scan_report.html

      # Trivy - Container Vulnerability Scan (using aquasec/trivy)
      - name: Run Trivy Scan for Container Vulnerabilities
        run: |
          docker run --rm \
            -v $(pwd):/results \
            aquasec/trivy:latest \
            --format html --output /results/trivy_report.html \
            --no-progress \
            --scan-repository bkimminich/juice-shop

      # SQLMap - Automated SQL Injection Testing (via Docker)
      - name: Run SQLMap Scan for SQL Injection Vulnerabilities (via Docker)
        run: |
          docker run --rm \
            -v $(pwd):/results \
            --entrypoint /bin/bash \
            python:3.9-slim -c "pip install sqlmap && sqlmap -u 'http://localhost:3000/rest/user/login' --batch --crawl=3 --risk=3 --level=5 --output-dir=/results/sqlmap_report"

      # Semgrep - Code Analysis for Vulnerabilities (via Docker)
      - name: Run Semgrep Security Scan (via Docker)
        run: |
          docker run --rm \
            -v $(pwd):/src \
            returntocorp/semgrep:latest \
            semgrep --config="https://semgrep.dev/p/oss-security" --output /src/semgrep_report.json

      # Combine all reports into a single report
      - name: Combine Reports into One
        run: |
          echo "<html><head><title>Security Scan Report</title></head><body>" > combined_report.html
          echo "<h1>Full Stack Security Scan Report</h1>" >> combined_report.html

          # ZAP Report Section
          echo "<h2>ZAP Security Scan Report</h2>" >> combined_report.html
          cat zap_full_scan_report.html >> combined_report.html

          # Trivy Report Section
          echo "<h2>Trivy Container Scan Report</h2>" >> combined_report.html
          cat trivy_report.html >> combined_report.html

          # SQLMap Report Section
          echo "<h2>SQLMap Scan Report</h2>" >> combined_report.html
          echo "<pre>" >> combined_report.html
          cat sqlmap_report/* >> combined_report.html
          echo "</pre>" >> combined_report.html

          # Semgrep Report Section
          echo "<h2>Semgrep Scan Report</h2>" >> combined_report.html
          echo "<pre>" >> combined_report.html
          cat semgrep_report.json >> combined_report.html
          echo "</pre>" >> combined_report.html

          echo "</body></html>" >> combined_report.html

      # Upload Combined Report
      - name: Upload Combined Report
        uses: actions/upload-artifact@v3
        with:
          name: full-stack-security-report
          path: combined_report.html
